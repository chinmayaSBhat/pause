<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pause</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
        }
        .mobile-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        /* Color Palette Overrides */
        .bg-streak {
            background-color: #1a202c;
            color: #ffffff;
        }
        .text-success-dark {
            color: #2d6a4f; /* Deep green */
        }
        .btn-success-dark {
            background-color: #2d6a4f;
            border-color: #2d6a4f;
            color: white;
        }
        .btn-success-dark:hover {
            background-color: #1b4332;
            border-color: #1b4332;
            color: white;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="mobile-container position-relative pb-5 mb-5">
        {% block content %}{% endblock %}
    </div>
    
    {% if request and request.url.path != '/login' %}
    <!-- Bottom Navigation -->
    <nav class="navbar fixed-bottom navbar-light bg-light border-top" style="max-width: 480px; margin: 0 auto;">
        <div class="container-fluid justify-content-around">
            <a href="/" class="text-center text-decoration-none text-dark">
                <i class="bi bi-house-door fs-4"></i><br><small>Home</small>
            </a>
            <a href="/goals" class="text-center text-decoration-none text-dark">
                <i class="bi bi-bullseye fs-4"></i><br><small>Goals</small>
            </a>
            <a href="/achievements" class="text-center text-decoration-none text-dark">
                <i class="bi bi-trophy fs-4"></i><br><small>Badges</small>
            </a>
            <a href="/profile" class="text-center text-decoration-none text-dark">
                <i class="bi bi-person fs-4"></i><br><small>Profile</small>
            </a>
        </div>
    </nav>
    {% endif %}
    
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
